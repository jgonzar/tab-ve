<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph card — 1200x630, the size summary_large_image expects.

    Archival master for static/og.png. Everything here is lifted from
    design/icons/icon.svg on purpose: same gradient stops, same glyph
    geometry in the same 1024 coordinate space, so the share card and the
    home-screen icon are visibly the same mark.

    Ground is #1d232a, the base-100 token, i.e. the app's own page colour,
    rather than a full purple field. A 1200x630 purple slab just reads as a
    blown-up icon; the dark ground lets the tile stay the accent and keeps
    the card looking like the product.

    Note: XML comments cannot contain a double hyphen, so token names are
    written without their CSS custom-property prefix. sips reports exit 0
    and prints an output path even when the parse fails, so always verify
    the real pixel dimensions after rasterising.

    No <filter> anywhere: sips rasterises gradients reliably but blur support
    is not worth betting the build on. The glow is a radialGradient fill.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#6a44f5"/>
    </linearGradient>

    <radialGradient id="glow" cx="940" cy="315" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#8b6cff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#8b6cff" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#8b6cff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8b6cff" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="630" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#8b6cff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8b6cff" stop-opacity="0.16"/>
      <stop offset="1"    stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#1d232a"/>

  <!-- Ambient glow behind the tile -->
  <ellipse cx="940" cy="315" rx="340" ry="320" fill="url(#glow)"/>

  <!--
    Background echo of the route curve. The square icon has to cram this
    shape; 1200x630 is the one canvas where it can actually run, so the
    wide format earns its keep instead of being a stretched icon.
  -->
  <path d="M -40 600 C 260 470, 420 300, 760 250 C 980 218, 1120 150, 1260 40"
        fill="none" stroke="url(#trail)" stroke-width="2.5"/>

  <!-- Top edge highlight -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#hairline)"/>

  <!-- ── Left column ─────────────────────────────────────────────────── -->
  <text x="96" y="262"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" fill="#ffffff"
        letter-spacing="-1.5">Yummy Track</text>

  <text x="96" y="324"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#9aa4b2">Offline-first ride payment tracking,</text>

  <text x="96" y="366"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#9aa4b2">with live BCV rate conversion.</text>

  <text x="97" y="438"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#7c6bd4"
        letter-spacing="2.6">SVELTEKIT  ·  DRIZZLE  ·  POSTGRES  ·  PWA</text>

  <!-- ── Icon tile ───────────────────────────────────────────────────── -->
  <g transform="translate(790 165)">
    <rect width="300" height="300" rx="66" ry="66" fill="url(#tile)"/>

    <!--
      Glyph in its native 1024 space, scaled to the 300px tile.
      0.2930 = 300/1024. Identical paths to design/icons/icon.svg.
    -->
    <g transform="scale(0.2930)">
      <path d="M 296 660 C 380 456, 560 424, 686 464"
            fill="none" stroke="#ffffff" stroke-width="44"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="300" cy="720" r="52" fill="none" stroke="#ffffff" stroke-width="44"/>
      <path d="M 700 512 C 660 430, 588 412, 588 330 A 112 112 0 1 1 812 330 C 812 412, 740 430, 700 512 Z"
            fill="#ffffff"/>
      <circle cx="700" cy="330" r="46" fill="#7657f8"/>
    </g>
  </g>
</svg>
