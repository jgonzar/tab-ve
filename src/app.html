<!doctype html>
<html lang="%lang%" data-theme="tab">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-180.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tab" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- Static hex: the app is dark-only (data-theme is hardcoded above), so this
		     never needs updating from JS. Matches the Tab theme's --color-base-200
		     (app.css), the navbar colour that sits against the status bar in
		     standalone. Keep it in step with static/manifest.webmanifest. -->
		<meta name="theme-color" content="#13113f" />

		<!-- The title, description, robots and link-preview tags, which differ
		     between the real app and the demo: src/lib/server/head.ts, filled in
		     by the head handle in hooks.server.ts. -->
		<!-- tab.head -->

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
