<!doctype html>
<html lang="es" data-theme="tab">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Tab</title>
		<!-- English, like the link-preview copy below: the description is read by
		     search engines and scrapers, not by the people using the app. -->
		<meta name="description" content="Offline-first ride payment tracker with live BCV exchange-rate conversion." />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-180.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tab" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- Static hex: the app is dark-only (data-theme is hardcoded above), so this
		     never needs updating from JS. Matches the Tab theme's --color-base-200
		     (app.css), the navbar colour that sits against the status bar in
		     standalone. Keep it in step with static/manifest.webmanifest. -->
		<meta name="theme-color" content="#13113f" />

		<!-- Link previews.
		     Absolute URLs on purpose: scrapers do not resolve relative paths, and
		     og:url is the canonical, so preview deploys advertise production too.
		     Copy is English while the app itself stays Spanish, because the people
		     who follow a shared link are not the people who use the app.
		     og:locale is omitted deliberately: it defaults to en_US, which matches
		     the copy below, and es_VE would contradict it.
		     Image is static/og.png, 1200x630, from design/og.svg. The dimension
		     hints let a scraper lay out the card without fetching the file. -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://tab-ve.vercel.app/" />
		<meta property="og:site_name" content="Tab" />
		<meta property="og:title" content="Tab" />
		<meta property="og:description" content="Offline-first ride payment tracker with live BCV exchange-rate conversion." />
		<meta property="og:image" content="https://tab-ve.vercel.app/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Tab: offline-first ride payment tracking with live BCV rate conversion" />
		<meta name="twitter:card" content="summary_large_image" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
